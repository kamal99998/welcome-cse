name: Postman API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build
      - name: Build project
        run: |
          echo "Building project..."
          test -f package.json
          test -f server.js
          test -d build
          test -f build/index.html
          echo "Build verification successful"

      # 5. Start server
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      # 6. Wait for server
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5000; then
              echo "Server is running"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 1
          done

          echo "Server failed to start"
          cat server.log
          exit 1

      # 7. Install Newman
      - name: Install Newman
        run: npm install -g newman

      # 8. Check Newman
      - name: Check Newman
        run: newman --version

      # 9. Run Postman collections
      - name: Run Postman tests
        run: |
          newman run postman/344_kamal.json
